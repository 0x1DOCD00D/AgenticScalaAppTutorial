name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: "true" # build.sbt turns on -Werror
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Format check, compile, test
        run: sbt -batch "scalafmtCheckAll; Test/compile; test"

  # Build (and on main, push) the production image so a green main is always deployable.
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC to AWS — no long-lived keys in secrets
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Build image
        run: APP_VERSION=${GITHUB_SHA::12} sbt -batch Docker/publishLocal

      - name: Configure AWS credentials (OIDC)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Push to ECR
        if: github.ref == 'refs/heads/main'
        run: |
          ECR_URL=$(aws ecr describe-repositories --repository-names taskforge \
            --query 'repositories[0].repositoryUri' --output text)
          aws ecr get-login-password | docker login --username AWS --password-stdin "${ECR_URL%%/*}"
          docker tag "taskforge:${GITHUB_SHA::12}" "${ECR_URL}:${GITHUB_SHA::12}"
          docker push "${ECR_URL}:${GITHUB_SHA::12}"
