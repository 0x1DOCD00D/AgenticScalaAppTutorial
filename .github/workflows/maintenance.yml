# The maintenance half of the lifecycle, on a clock: every Monday Claude Code runs headless,
# audits dependencies with the dependency-updater playbook, and opens a PR if anything is due.
name: Weekly maintenance

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run dependency audit headless
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "Use the dependency-updater agent to audit all dependencies in build.sbt, \
          project/plugins.sbt and project/build.properties. Apply safe patch/minor upgrades, \
          run 'sbt check' to verify, and report a changelog-style summary. Do NOT apply major \
          upgrades; list them as recommendations instead." \
            --allowedTools "Read,Grep,Glob,Edit,Bash(sbt *),WebSearch,WebFetch" \
            --max-turns 40 \
            --output-format text | tee audit.txt

      - name: Open PR if changes were made
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "claude-maintenance[bot]"
            git config user.email "noreply@anthropic.com"
            BRANCH="maintenance/deps-$(date +%Y%m%d)"
            git checkout -b "$BRANCH"
            git add -A
            git commit -m "chore(deps): weekly dependency maintenance"
            git push origin "$BRANCH"
            gh pr create --title "Weekly dependency maintenance" \
              --body-file audit.txt --base main --head "$BRANCH"
          else
            echo "No dependency changes this week."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
