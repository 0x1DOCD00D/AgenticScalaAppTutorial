# Local development: `docker compose up -d db` gives the app (and integration tests)
# a PostgreSQL identical in major version to the RDS instance.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: taskforge
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: taskforge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: taskforge:latest   # produced by `sbt dockerLocal`
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/taskforge
      DB_USER: taskforge
      DB_PASSWORD: taskforge
    ports:
      - "8080:8080"
